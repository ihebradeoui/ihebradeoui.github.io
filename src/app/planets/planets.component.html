<div class="planets-container">
  <canvas id="planetsCanvas"></canvas>
  
  <!-- Leaderboard Toggle Button -->
  <button id="leaderboardToggle" class="leaderboard-toggle" title="View Leaderboard">
    🏆
  </button>
  
  <!-- Leaderboard Panel -->
  <div id="leaderboardPanel" class="leaderboard-panel">
    <div class="leaderboard-header">
      <h3>🏆 Planet Leaderboard</h3>
      <button id="leaderboardClose" class="leaderboard-close">&times;</button>
    </div>
    <div class="leaderboard-subtitle">Longest Planet Name Ownership</div>
    <div id="leaderboardContent" class="leaderboard-content">
      <div class="leaderboard-loading">Loading...</div>
    </div>
  </div>
  
  <div id="planetModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>✨ Edit Planet ✨</h2>
      <p style="text-align: center; color: #8a7fff; margin-top: -5px; margin-bottom: 25px; font-size: 14px; font-style: italic;">Customize your cosmic world</p>
      <form id="planetForm">
        <div>
          <label for="planetName">🌍 Planet Name</label>
          <input type="text" id="planetName" name="planetName" required placeholder="Enter planet name...">
        </div>
        
        <div>
          <label for="planetDescription">📝 Description</label>
          <textarea id="planetDescription" name="planetDescription" rows="4" required placeholder="Describe your planet's unique features..."></textarea>
        </div>

        <div style="margin-top: 20px; padding: 15px; background: rgba(138, 127, 255, 0.1); border-radius: 8px; border: 1px solid rgba(138, 127, 255, 0.3);">
          <div class="custom-cards-label">🎨 Planet Customizations</div>
          <div class="custom-cards-grid">

            <div class="custom-card">
              <input type="checkbox" id="custom_cosmic_rings">
              <label for="custom_cosmic_rings">
                <span class="custom-card-badge">✓</span>
                <span class="custom-card-icon">🪐</span>
                <span class="custom-card-name">Cosmic Rings</span>
                <span class="custom-card-desc">Vibrant multicolor rings shimmer around your world</span>
              </label>
            </div>

            <div class="custom-card">
              <input type="checkbox" id="custom_star_aura">
              <label for="custom_star_aura">
                <span class="custom-card-badge">✓</span>
                <span class="custom-card-icon">⭐</span>
                <span class="custom-card-name">Star Aura</span>
                <span class="custom-card-desc">A pulsing stellar corona glows around the planet</span>
              </label>
            </div>

            <div class="custom-card">
              <input type="checkbox" id="custom_moon_companion">
              <label for="custom_moon_companion">
                <span class="custom-card-badge">✓</span>
                <span class="custom-card-icon">🌙</span>
                <span class="custom-card-name">Moon Companion</span>
                <span class="custom-card-desc">A cute moon faithfully orbits your planet</span>
              </label>
            </div>

            <div class="custom-card">
              <input type="checkbox" id="custom_crystal_shield">
              <label for="custom_crystal_shield">
                <span class="custom-card-badge">✓</span>
                <span class="custom-card-icon">🔮</span>
                <span class="custom-card-name">Crystal Shield</span>
                <span class="custom-card-desc">A glowing crystalline energy barrier pulses around the world</span>
              </label>
            </div>

            <div class="custom-card">
              <input type="checkbox" id="custom_nebula_cloud">
              <label for="custom_nebula_cloud">
                <span class="custom-card-badge">✓</span>
                <span class="custom-card-icon">🌌</span>
                <span class="custom-card-name">Nebula Cloud</span>
                <span class="custom-card-desc">Swirling cosmic nebula particles engulf the planet</span>
              </label>
            </div>

            <div class="custom-card">
              <input type="checkbox" id="custom_comet_streaks">
              <label for="custom_comet_streaks">
                <span class="custom-card-badge">✓</span>
                <span class="custom-card-icon">☄️</span>
                <span class="custom-card-name">Comet Streaks</span>
                <span class="custom-card-desc">Glowing micro-comets race in brilliant arcs</span>
              </label>
            </div>

            <div class="custom-card">
              <input type="checkbox" id="custom_sparkle_orbit">
              <label for="custom_sparkle_orbit">
                <span class="custom-card-badge">✓</span>
                <span class="custom-card-icon">✨</span>
                <span class="custom-card-name">Sparkle Orbit</span>
                <span class="custom-card-desc">Magical star sparkles dance around the planet</span>
              </label>
            </div>

            <div class="custom-card">
              <input type="checkbox" id="custom_aurora_glow">
              <label for="custom_aurora_glow">
                <span class="custom-card-badge">✓</span>
                <span class="custom-card-icon">🌈</span>
                <span class="custom-card-name">Aurora Glow</span>
                <span class="custom-card-desc">A mesmerizing multicolor aurora wraps the planet</span>
              </label>
            </div>

          </div>
        </div>
        
        <div style="margin-top: 20px; padding: 15px; background: rgba(138, 127, 255, 0.1); border-radius: 8px; border: 1px solid rgba(138, 127, 255, 0.3);">
          <label style="display: flex; align-items: center; cursor: pointer;">
            <input type="checkbox" id="enablePayment" style="margin-right: 10px; width: 18px; height: 18px;">
            <span>💎 Subscribe with PayPal ($2.99/month)</span>
          </label>
          <p style="margin: 8px 0 0 28px; font-size: 12px; color: #9999ff; font-style: italic;">
            Your planet names will be saved permanently while subscribed. Free saves are temporary.
          </p>
        </div>
        
        <div id="paypal-button-container" style="display: none; margin-top: 15px;"></div>
        
        <button type="submit" id="saveButton">🚀 Save Planet</button>
      </form>
    </div>
  </div>
</div>
