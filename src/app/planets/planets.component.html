<div class="planets-container">
  <canvas id="planetsCanvas"></canvas>
  
  <!-- Leaderboard Toggle Button -->
  <button id="leaderboardToggle" class="leaderboard-toggle" title="View Leaderboard">
    🏆
  </button>
  
  <!-- Leaderboard Panel -->
  <div id="leaderboardPanel" class="leaderboard-panel">
    <div class="leaderboard-header">
      <h3>🏆 Planet Leaderboard</h3>
      <button id="leaderboardClose" class="leaderboard-close">&times;</button>
    </div>
    <div class="leaderboard-subtitle">Longest Planet Name Ownership</div>
    <div id="leaderboardContent" class="leaderboard-content">
      <div class="leaderboard-loading">Loading...</div>
    </div>
  </div>
  
  <div id="planetModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>✨ Edit Planet ✨</h2>
      <p style="text-align: center; color: #8a7fff; margin-top: -5px; margin-bottom: 25px; font-size: 14px; font-style: italic;">Customize your cosmic world</p>
      <form id="planetForm">
        <div>
          <label for="planetName">🌍 Planet Name</label>
          <input type="text" id="planetName" name="planetName" required placeholder="Enter planet name...">
        </div>
        
        <div>
          <label for="planetDescription">📝 Description</label>
          <textarea id="planetDescription" name="planetDescription" rows="4" required placeholder="Describe your planet's unique features..."></textarea>
        </div>

        <div style="margin-top: 20px; padding: 15px; background: rgba(138, 127, 255, 0.1); border-radius: 8px; border: 1px solid rgba(138, 127, 255, 0.3);">
          <label style="display: block; font-weight: 600; font-size: 15px; color: #b8b8ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;">🎨 Planet Customizations</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <label class="customization-option" title="Vibrant multicolor rings shimmer around your world">
              <input type="checkbox" id="custom_cosmic_rings"> 🪐 Cosmic Rings
            </label>
            <label class="customization-option" title="A pulsing stellar corona glows around the planet">
              <input type="checkbox" id="custom_star_aura"> ⭐ Star Aura
            </label>
            <label class="customization-option" title="A cute little moon faithfully orbits your planet">
              <input type="checkbox" id="custom_moon_companion"> 🌙 Moon Companion
            </label>
            <label class="customization-option" title="A glowing crystalline energy barrier pulses around the world">
              <input type="checkbox" id="custom_crystal_shield"> 🔮 Crystal Shield
            </label>
            <label class="customization-option" title="Swirling cosmic nebula particles engulf the planet">
              <input type="checkbox" id="custom_nebula_cloud"> 🌌 Nebula Cloud
            </label>
            <label class="customization-option" title="Glowing micro-comets race in brilliant arcs around the planet">
              <input type="checkbox" id="custom_comet_streaks"> ☄️ Comet Streaks
            </label>
            <label class="customization-option" title="Magical star sparkles dance around the planet">
              <input type="checkbox" id="custom_sparkle_orbit"> ✨ Sparkle Orbit
            </label>
            <label class="customization-option" title="A mesmerizing multicolor aurora wraps the planet">
              <input type="checkbox" id="custom_aurora_glow"> 🌈 Aurora Glow
            </label>
          </div>
        </div>
        
        <div style="margin-top: 20px; padding: 15px; background: rgba(138, 127, 255, 0.1); border-radius: 8px; border: 1px solid rgba(138, 127, 255, 0.3);">
          <label style="display: flex; align-items: center; cursor: pointer;">
            <input type="checkbox" id="enablePayment" style="margin-right: 10px; width: 18px; height: 18px;">
            <span>💎 Subscribe with PayPal ($2.99/month)</span>
          </label>
          <p style="margin: 8px 0 0 28px; font-size: 12px; color: #9999ff; font-style: italic;">
            Your planet names will be saved permanently while subscribed. Free saves are temporary.
          </p>
        </div>
        
        <div id="paypal-button-container" style="display: none; margin-top: 15px;"></div>
        
        <button type="submit" id="saveButton">🚀 Save Planet</button>
      </form>
    </div>
  </div>
</div>
